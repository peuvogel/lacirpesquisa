name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor escopo possivel para o GITHUB_TOKEN: este job so faz checkout,
# build e teste — nao escreve nada no repositorio. Sem este bloco, o token
# herda o padrao da organizacao/repositorio, que pode incluir escrita.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run gate
